url: https://jonpayneea.github.io/reach.rate/

template:
  bootstrap: 5
  bslib:
    primary: "#00A33B"
    base_font: {google: "Atkinson Hyperlegible"}
    code_font: {google: "JetBrains Mono"}

development:
  mode: auto

articles:
- title: Guides
  navbar: Guides
  contents:
  - rating_curves_guide
  - rating_methods_overview
  - s7_objects_guide
  - rating_curve_walkthrough
  - non_standard_optimisation
  - n_bounds_guide
  - weir_flume_guide
  - leverage_influence_guide
  - recency_weighting_guide
  - objective_guide
  - segmented_model_guide

reference:
- title: Using a rating
  desc: >
    Apply a fitted rating to a stage record, invert it, and compare it
    with the rating it replaces. The guided workflow (read_gaugings(),
    validate_gaugings(), fit_rating(), assess_rating(), export_rating())
    is planned; see IMPROVEMENT_PLAN.md.
  contents:
  - apply_rating
  - apply_rating_inverse
  - compare_ratings
  - plot_rating_comparison

- title: Advanced modelling
  desc: >
    Direct control over fitting. Until fit_rating() arrives,
    rate_optimise() is the entry point. suggest_breakpoints() proposes
    statistical candidates only; whether a breakpoint marks a real change
    of control is a hydraulic judgement.
  contents:
  - rate_optimise
  - rate_optimise_constrained
  - rate_optimise_segmented
  - suggest_breakpoints
  - align_limb_equations
  - align_limb_boundaries
  - graft_rating

- title: Diagnostics
  desc: >
    Residuals, extrapolation, influence, and the discharge gaps left where
    independently-fitted limbs meet.
  contents:
  - plot_rating_residuals
  - flag_extrapolated_limbs
  - flag_influential_gaugings
  - plot_rating_leverage
  - detect_rc_gaps
  - plot_rc_gaps

- title: Uncertainty
  desc: Bootstrap coefficient draws propagated to a discharge interval.
  contents:
  - apply_rating_interval
  - plot_rating_interval
  - bootstrap_to_table

- title: Plotting
  contents:
  - rating_plot
  - plot_rating_curves

- title: Specialist hydraulics
  desc: >
    Ratings and discharges derived from channel or structure geometry
    rather than fitted to gaugings: Manning's equation on a surveyed
    cross-section, and standard weir and flume equations with GUM-style
    propagated uncertainty.
  contents:
  - rate_from_cross_section
  - plot_rating_cross_section
  - weir_discharge_rectangular
  - weir_discharge_vnotch
  - weir_discharge_cipoletti
  - flume_discharge_parshall

- title: Conversion and rating tables
  desc: >
    Move between a fitted rating and its equation-table form, patch
    junction gaps at table level, and apply ratings that changed over time.
  contents:
  - as_rating_table
  - expand_rating_table
  - resolve_rc_gaps
  - apply_rating_versioned

- title: Rating objects
  desc: >
    The S7 classes behind every fit. Accessor functions (planned) will
    replace direct property access in user code.
  contents:
  - FlodeRatingBase
  - FlodeRating
  - FlodeSegmentedRating
  - FlodeRatingTable

- title: Teaching tools
  desc: >
    Demonstrations on synthetic data, for learning the package rather
    than building a rating from your own evidence.
  contents:
  - run_demo
  - rating_curve_explorer
  - demo_cross_section_rating
  - station_gaugings

- title: Deprecated
  desc: Still working, but scheduled for removal. Each page names its replacement.
  contents:
  - suggested_breakpoints_vector
