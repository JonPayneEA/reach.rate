# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Reports line coverage to the job summary and keeps a Cobertura file as
# an artifact. No external coverage service, so no token to manage.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          by_file <- covr::tally_coverage(cov, by = "line")
          by_file <- aggregate(value ~ filename, data = by_file, FUN = function(v) 100 * mean(v > 0))
          by_file <- by_file[order(by_file$value), ]
          lines <- c(
            "## Test coverage",
            "",
            sprintf("**%.1f%%** line coverage overall.", covr::percent_coverage(cov)),
            "",
            "| File | Line coverage |",
            "|---|---|",
            sprintf("| `%s` | %.1f%% |", by_file$filename, by_file$value)
          )
          writeLines(lines, Sys.getenv("GITHUB_STEP_SUMMARY"))
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: cobertura.xml
          if-no-files-found: warn

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
