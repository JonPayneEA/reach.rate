url: https://jonpayneea.github.io/reach.rate/

template:
  bootstrap: 5
  # pkgdown 2.1+ defaults to MathML conversion, which needs the katex R
  # package; without it equations are left as raw $$...$$ text. MathJax
  # renders in the browser and needs nothing on the build machine.
  math-rendering: mathjax
  bslib:
    primary: "#00A33B"
    base_font: {google: "Atkinson Hyperlegible"}
    code_font: {google: "JetBrains Mono"}

development:
  mode: auto

articles:
- title: Guides
  navbar: Guides
  contents:
  - rating_curves_guide
  - rating_methods_overview
  - mathematical_contract
  - s7_objects_guide
  - rating_curve_walkthrough
  - non_standard_optimisation
  - n_bounds_guide
  - weir_flume_guide
  - leverage_influence_guide
  - recency_weighting_guide
  - objective_guide
  - segmented_model_guide

reference:
- title: Reading data
  desc: >
    Bring a gauging archive and an operational ratings export into R
    without cleaning them. Every row is kept; what did not parse is noted
    on the row. match_stations() links the two files' station ids, with a
    table you supply where the ids differ, and check_operational_ratings()
    compares every rating with its gaugings and lists what could not be
    compared. read_gaugings() takes delimited text, a spreadsheet or a
    data.frame, and read_summary() reports what it found as a table.
  contents:
  - read_gaugings
  - read_summary
  - read_operational_ratings
  - operational_rating_tables
  - match_stations
  - check_operational_ratings

- title: Fitting a rating
  desc: >
    The guided way to a rating. fit_rating() takes evidence and fits one
    with defaults a careful analyst would not argue with (one limb, the
    relative objective), and records what it did: the call, the seed, what
    was used and left out and why, where any breakpoints came from, and the
    range the rating may be applied over. set_operational_limits() states
    that range. Experts can still call rate_optimise() directly.
  contents:
  - fit_rating
  - set_operational_limits
  - breakpoint_origins

- title: Checking evidence
  desc: >
    Ask whether a set of gaugings can be used and whether it looks right
    for a river. Technical checks fail; hydrometric checks only warn, and
    nothing is removed. The result is a FlodeAssessment, a table of checks
    that a fitted rating's assessment will reuse. rating_invariants() runs
    the same kind of check on a rating's own equations and is what stops
    apply_rating() from using one that cannot give a meaningful discharge.
  contents:
  - validate_gaugings
  - assess_rating
  - rating_sensitivity
  - FlodeSensitivity
  - sensitivity_summary
  - sensitivity_results
  - rating_invariants
  - FlodeAssessment
  - assessment_checks
  - assessment_status

- title: Using a rating
  desc: >
    Apply a fitted rating to a stage record, invert it, and compare it
    with the rating it replaces. The guided workflow (read_gaugings(),
    validate_gaugings(), fit_rating(), assess_rating(), export_rating())
    is planned; see IMPROVEMENT_PLAN.md.
  contents:
  - apply_rating
  - apply_rating_inverse
  - compare_ratings
  - plot_rating_comparison

- title: Accessors
  desc: >
    Read a rating without reaching inside it. Each accessor works on every
    rating class that holds the information, returns a copy as a data.table
    with unit-suffixed columns (or a documented list), and says plainly
    when a class does not hold it.
  contents:
  - rating_limbs
  - rating_coefficients
  - rating_evidence
  - rating_diagnostics
  - rating_support
  - rating_bootstrap
  - rating_history
  - rating_provenance

- title: Advanced modelling
  desc: >
    Direct control over fitting. Until fit_rating() arrives,
    rate_optimise() is the entry point. suggest_breakpoints() proposes
    statistical candidates only; whether a breakpoint marks a real change
    of control is a hydraulic judgement.
  contents:
  - rate_optimise
  - rate_optimise_constrained
  - rate_optimise_segmented
  - suggest_breakpoints
  - align_limb_equations
  - align_limb_boundaries
  - graft_rating
  - extend_rating_low

- title: Diagnostics
  desc: >
    Residuals, extrapolation, influence, a rating checked against a set of
    gaugings, and the discharge gaps left where independently-fitted
    limbs meet.
  contents:
  - plot_rating_residuals
  - compare_gaugings_to_rating
  - flag_extrapolated_limbs
  - flag_influential_gaugings
  - plot_rating_leverage
  - detect_rc_gaps
  - check_limb_continuity
  - plot_rc_gaps

- title: Uncertainty
  desc: Bootstrap coefficient draws propagated to a discharge interval.
  contents:
  - apply_rating_interval
  - plot_rating_interval

- title: Plotting
  contents:
  - rating_plot
  - plot_rating_curves

- title: Specialist hydraulics
  desc: >
    Ratings and discharges derived from channel or structure geometry
    rather than fitted to gaugings: Manning's equation on a surveyed
    cross-section, and standard weir and flume equations with GUM-style
    propagated uncertainty.
  contents:
  - rate_from_cross_section
  - plot_rating_cross_section
  - weir_discharge_rectangular
  - weir_discharge_vnotch
  - weir_discharge_cipoletti
  - flume_discharge_parshall

- title: Conversion and rating tables
  desc: >
    Move between a fitted rating and its equation-table form, patch
    junction gaps at table level, and apply ratings that changed over time.
  contents:
  - as_rating_table
  - convert_offset_convention
  - expand_rating_table
  - resolve_rc_gaps
  - apply_rating_versioned

- title: Rating objects
  desc: >
    The S7 classes behind every fit. Read them through the accessors
    above, not by property; vignette("s7_objects_guide") is the
    maintainer's guide to how they are built.
  contents:
  - FlodeRatingBase
  - FlodeRating
  - FlodeSegmentedRating
  - FlodeRatingTable
  - FlodeEvidence
  - as_flode_evidence
  - evidence_source_types
  - rating_schema_version

- title: Teaching tools
  desc: >
    Demonstrations on synthetic data, for learning the package rather
    than building a rating from your own evidence.
  contents:
  - run_demo
  - rating_curve_explorer
  - demo_cross_section_rating
  - station_gaugings

- title: Deprecated
  desc: Still working, but scheduled for removal. Each page names its replacement.
  contents:
  - suggested_breakpoints_vector
  - bootstrap_to_table
